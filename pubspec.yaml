name: cinelearn
description: "Learn English through movies with gesture-based vocabulary learning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Database
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Video Player (simpler, no native download during build)
  video_player: ^2.9.3
  chewie: ^1.10.0
  
  # Video Processing
  # Video Processing (Temporarily disabled due to build issues)
  ffmpeg_kit_flutter_new_min_gpl: ^2.1.1 # Updated to existing version of new package
  
  # HTTP & API
  http: ^1.3.0
  
  # File Handling
  file_picker: ^9.2.0
  
  # UI & Animations
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flip_card: ^0.7.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  audioplayers: ^6.5.1
  confetti: ^0.8.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
